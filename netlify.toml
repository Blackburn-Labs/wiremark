# Netlify config for the wiremark docs site (docs.wiremark.dev).
#
# The main marketing site (www.wiremark.dev) is a separate repo/deploy. This
# config builds ONLY the docs site, from this repo's site/ directory.
#
# base = "site" makes Netlify install and build inside site/. The build runs
# site's `prebuild` hook first (node ../scripts/generate-reference.mjs), which
# regenerates ../docs/reference/components.md from meta/element-specs.json and
# the condensed component lists in the agent guides from the LIVE element
# registry (packages/core/src/elements), so the published reference is always
# in sync with the source of truth.
#
# Because the generator imports packages/core (which depends on roughjs), the
# workspace root's dependencies must be installed too -- Netlify only installs
# site/'s by default with base = "site" -- hence the `npm ci --prefix ..`.

[build]
  base = "site"
  command = "npm ci --prefix .. && npm run build"
  publish = "build"
  # Skip the deploy unless something the docs site actually consumes changed:
  # the site app itself, the docs content, the element-spec matrix, core's src
  # (the agent-guide component lists are generated from the live registry),
  # the generator script, or this config. Exit 0 = skip build.
  # Note: with base = "site", this command runs FROM site/, hence the ../ paths.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../site ../docs ../meta ../packages/core/src ../scripts/generate-reference.mjs ../netlify.toml"

[build.environment]
  NODE_VERSION = "20"

# --- Optional: serve under www.wiremark.dev/docs instead of a subdomain ---
# Keep this build as-is but set these env vars in the Netlify UI for this site:
#   DOCS_URL      = https://www.wiremark.dev
#   DOCS_BASE_URL = /docs/
# Then add a proxy rewrite on the MAIN site (its _redirects or netlify.toml):
#   /docs/*  https://<this-docs-site>.netlify.app/docs/:splat  200
