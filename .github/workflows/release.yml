name: Publish to npm

# Publishes the scoped wiremark packages to npm via OIDC trusted publishing — no
# NPM_TOKEN secret required. Provenance is generated because the source repo is
# public. Packages are published in dependency order:
#
#   - @wiremark/core  (packages/core) — the library
#   - @wiremark/cli   (packages/cli)  — the command-line renderer, depends on core
#
# One-time prerequisite PER PACKAGE: it must already exist on npm and have a
# Trusted Publisher configured (GitHub Actions -> this repo -> workflow
# "release.yml", allowed action "npm publish") on its Access page:
#   https://www.npmjs.com/package/@wiremark/core/access
#   https://www.npmjs.com/package/@wiremark/cli/access
# Because trusted publishing needs the package to pre-exist, the very first
# publish of each package is done manually (`npm publish --access public`); CI
# takes over for every release after.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # OIDC requires Node >= 22.14
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --workspace @wiremark/core

      # Publish core first — @wiremark/cli pins this exact version as a dependency.
      - name: Publish @wiremark/core (OIDC + provenance)
        run: npm publish --provenance --access public
        working-directory: packages/core

      - name: Publish @wiremark/cli (OIDC + provenance)
        run: npm publish --provenance --access public
        working-directory: packages/cli
